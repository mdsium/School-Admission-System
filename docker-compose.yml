services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: admission
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d admission"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION_STRING: "Host=db;Port=5432;Database=admission;Username=postgres;Password=postgres"
      HOLD_DURATION_SECONDS: "600"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: "http://localhost:8080"   # browser-side URL of the backend
    ports:
      - "3000:80"

volumes:
  pgdata:
    name: school_admission_pgdata
